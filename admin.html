<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - DPIPS Sala de Reservas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f4f7fc;
            color: #1e2a3a;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .login-box {
            max-width: 400px;
            margin: 60px auto;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #ccd7e6;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .login-box button {
            background: #1a4b6d;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-box button:hover {
            background: #0b2a4a;
        }
        .login-box .erro {
            color: #c62828;
            margin-top: 10px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .admin-header h1 {
            font-size: 1.8rem;
            color: #0b2a4a;
        }
        .admin-header h1 i {
            color: #1a4b6d;
        }
        .admin-header .btn-sair {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }
        .admin-header .btn-sair:hover {
            background: #b71c1c;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tabs button {
            background: #eef3f9;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            color: #1e2a3a;
        }
        .tabs button.ativo {
            background: #1a4b6d;
            color: white;
        }
        .tabs button:hover {
            background: #d0e2f5;
        }
        .tab-content {
            display: none;
        }
        .tab-content.ativo {
            display: block;
        }
        .card-admin {
            background: #f9fbfd;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .card-admin h3 {
            margin-bottom: 15px;
            color: #1a4b6d;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-weight: 500;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #ccd7e6;
            font-size: 0.95rem;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .btn-salvar {
            background: #1a4b6d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-salvar:hover {
            background: #0b2a4a;
        }
        .btn-excluir {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-excluir:hover {
            background: #b71c1c;
        }
        .btn-editar {
            background: #ffb347;
            color: #1e2a3a;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 6px;
        }
        .btn-editar:hover {
            background: #ffa726;
        }
        .lista-items {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }
        .lista-items li {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            border-left: 5px solid #1a4b6d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .lista-items li .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lista-items li .info .badge {
            background: #e2e8f0;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .lista-items li .info .badge.ativo {
            background: #2e7d32;
            color: white;
        }
        .lista-items li .info .badge.inativo {
            background: #c62828;
            color: white;
        }
        .lista-items li .acoes {
            display: flex;
            gap: 6px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a4b6d;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
            max-width: 400px;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }
        .toast.show { display: block; }
        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #1a4b6d;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-placeholder {
            text-align: center;
            padding: 20px;
            color: #718096;
        }
        @media (max-width: 600px) {
            .form-group {
                grid-template-columns: 1fr;
            }
            .container { padding: 15px; }
            .admin-header h1 { font-size: 1.4rem; }
        }
        /* Tema escuro para admin? manter claro por enquanto */
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- TELA DE LOGIN -->
        <div id="loginScreen" class="login-box">
            <h2><i class="fas fa-user-shield"></i> Acesso Admin</h2>
            <p style="color:#718096; margin-bottom:20px;">Digite suas credenciais</p>
            <input type="email" id="loginEmail" placeholder="E-mail" value="dpips.dpips@gmail.com">
            <input type="password" id="loginSenha" placeholder="Senha" value="dpips2024">
            <button id="btnLogin">Entrar</button>
            <div id="loginErro" class="erro"></div>
        </div>

        <!-- PAINEL ADMIN (oculto inicialmente) -->
        <div id="adminPanel" style="display:none;">
            <div class="admin-header">
                <h1><i class="fas fa-cogs"></i> Painel Administrativo</h1>
                <button class="btn-sair" id="btnSair"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>

            <div class="tabs">
                <button class="ativo" data-tab="atalhos"><i class="fas fa-th-large"></i> Atalhos</button>
                <button data-tab="noticias"><i class="fas fa-newspaper"></i> Notícias</button>
                <button data-tab="estatisticas"><i class="fas fa-chart-bar"></i> Estatísticas</button>
            </div>

            <!-- ABAS -->
            <div id="tab-atalhos" class="tab-content ativo">
                <div class="card-admin">
                    <h3><i class="fas fa-plus-circle"></i> Adicionar Atalho</h3>
                    <form id="formAtalho">
                        <div class="form-group">
                            <div>
                                <label>Título *</label>
                                <input type="text" id="atalhoTitulo" placeholder="Ex: Adesão RN+ Saudável" required>
                            </div>
                            <div>
                                <label>Ícone (classe FontAwesome)</label>
                                <input type="text" id="atalhoIcone" placeholder="fa-handshake" value="fa-link">
                            </div>
                        </div>
                        <div class="form-group">
                            <div>
                                <label>Link (URL ou #)</label>
                                <input type="text" id="atalhoLink" placeholder="https://... ou #secao">
                            </div>
                            <div>
                                <label>Ordem (número)</label>
                                <input type="number" id="atalhoOrdem" placeholder="1" value="1">
                            </div>
                        </div>
                        <div class="form-group full">
                            <label>Alerta (mensagem exibida se não houver link)</label>
                            <input type="text" id="atalhoAlerta" placeholder="Funcionalidade em breve">
                        </div>
                        <div class="form-group full" style="display:flex; gap:20px; align-items:center;">
                            <label style="display:flex; align-items:center; gap:6px;">
                                <input type="checkbox" id="atalhoAtivo" checked> Ativo
                            </label>
                            <input type="hidden" id="atalhoId" value="">
                            <button type="submit" class="btn-salvar"><i class="fas fa-save"></i> Salvar</button>
                            <button type="button" class="btn-excluir" id="btnCancelarEdicao" style="display:none;">Cancelar</button>
                        </div>
                    </form>
                </div>

                <div class="card-admin">
                    <h3><i class="fas fa-list"></i> Atalhos Cadastrados</h3>
                    <div id="loadingAtalhos" class="loading-placeholder"><div class="spinner"></div> Carregando...</div>
                    <ul class="lista-items" id="listaAtalhos"></ul>
                </div>
            </div>

            <div id="tab-noticias" class="tab-content">
                <div class="card-admin">
                    <h3><i class="fas fa-plus-circle"></i> Adicionar Notícia</h3>
                    <form id="formNoticia">
                        <div class="form-group">
                            <div>
                                <label>Título *</label>
                                <input type="text" id="noticiaTitulo" placeholder="Título da notícia" required>
                            </div>
                            <div>
                                <label>Data (YYYY-MM-DD)</label>
                                <input type="date" id="noticiaData">
                            </div>
                        </div>
                        <div class="form-group full">
                            <label>Conteúdo *</label>
                            <textarea id="noticiaConteudo" placeholder="Resumo da notícia" required></textarea>
                        </div>
                        <div class="form-group full" style="display:flex; gap:20px; align-items:center;">
                            <label style="display:flex; align-items:center; gap:6px;">
                                <input type="checkbox" id="noticiaAtivo" checked> Ativo
                            </label>
                            <input type="hidden" id="noticiaId" value="">
                            <button type="submit" class="btn-salvar"><i class="fas fa-save"></i> Salvar</button>
                            <button type="button" class="btn-excluir" id="btnCancelarEdicaoNoticia" style="display:none;">Cancelar</button>
                        </div>
                    </form>
                </div>
                <div class="card-admin">
                    <h3><i class="fas fa-list"></i> Notícias Publicadas</h3>
                    <div id="loadingNoticias" class="loading-placeholder"><div class="spinner"></div> Carregando...</div>
                    <ul class="lista-items" id="listaNoticias"></ul>
                </div>
            </div>

            <div id="tab-estatisticas" class="tab-content">
                <div class="card-admin">
                    <h3><i class="fas fa-chart-pie"></i> Estatísticas Gerais</h3>
                    <div id="estatisticasContainer">
                        <div class="loading-placeholder"><div class="spinner"></div> Carregando...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- FIREBASE SDK (compatível com módulos? Vamos usar CDN para admin mais simples) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script>
        // ==========================================================
        // CONFIGURAÇÃO FIREBASE (compat)
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBfb6qslnV0Hr015QACJFZpyj8eTVYrfII",
            authDomain: "dpips-f9b0f.firebaseapp.com",
            projectId: "dpips-f9b0f",
            storageBucket: "dpips-f9b0f.firebasestorage.app",
            messagingSenderId: "578993170008",
            appId: "1:578993170008:web:bbfcc16f96d18abfb24c2d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ==========================================================
        // DOM REFS
        // ==========================================================
        const loginScreen = document.getElementById('loginScreen');
        const adminPanel = document.getElementById('adminPanel');
        const loginEmail = document.getElementById('loginEmail');
        const loginSenha = document.getElementById('loginSenha');
        const btnLogin = document.getElementById('btnLogin');
        const loginErro = document.getElementById('loginErro');
        const btnSair = document.getElementById('btnSair');
        const toast = document.getElementById('toast');

        // Atalhos
        const formAtalho = document.getElementById('formAtalho');
        const atalhoId = document.getElementById('atalhoId');
        const atalhoTitulo = document.getElementById('atalhoTitulo');
        const atalhoIcone = document.getElementById('atalhoIcone');
        const atalhoLink = document.getElementById('atalhoLink');
        const atalhoOrdem = document.getElementById('atalhoOrdem');
        const atalhoAlerta = document.getElementById('atalhoAlerta');
        const atalhoAtivo = document.getElementById('atalhoAtivo');
        const listaAtalhos = document.getElementById('listaAtalhos');
        const loadingAtalhos = document.getElementById('loadingAtalhos');
        const btnCancelarEdicao = document.getElementById('btnCancelarEdicao');

        // Notícias
        const formNoticia = document.getElementById('formNoticia');
        const noticiaId = document.getElementById('noticiaId');
        const noticiaTitulo = document.getElementById('noticiaTitulo');
        const noticiaData = document.getElementById('noticiaData');
        const noticiaConteudo = document.getElementById('noticiaConteudo');
        const noticiaAtivo = document.getElementById('noticiaAtivo');
        const listaNoticias = document.getElementById('listaNoticias');
        const loadingNoticias = document.getElementById('loadingNoticias');
        const btnCancelarEdicaoNoticia = document.getElementById('btnCancelarEdicaoNoticia');

        // Estatísticas
        const estatisticasContainer = document.getElementById('estatisticasContainer');

        // ==========================================================
        // TOAST
        // ==========================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ==========================================================
        // LOGIN
        // ==========================================================
        btnLogin.addEventListener('click', () => {
            const email = loginEmail.value.trim();
            const senha = loginSenha.value.trim();
            if (!email || !senha) {
                loginErro.textContent = 'Preencha e-mail e senha.';
                return;
            }
            loginErro.textContent = '';
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<div class="spinner"></div> Entrando...';

            auth.signInWithEmailAndPassword(email, senha)
                .then(() => {
                    loginScreen.style.display = 'none';
                    adminPanel.style.display = 'block';
                    carregarDados();
                    showToast('Bem-vindo, Admin!');
                })
                .catch(err => {
                    loginErro.textContent = 'Erro: ' + err.message;
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = 'Entrar';
                });
        });

        // Verificar se já está logado
        auth.onAuthStateChanged(user => {
            if (user) {
                loginScreen.style.display = 'none';
                adminPanel.style.display = 'block';
                carregarDados();
            } else {
                loginScreen.style.display = 'block';
                adminPanel.style.display = 'none';
            }
        });

        btnSair.addEventListener('click', () => {
            auth.signOut().then(() => {
                showToast('Desconectado.');
            });
        });

        // Enter nos campos de login
        loginSenha.addEventListener('keypress', e => { if (e.key === 'Enter') btnLogin.click(); });

        // ==========================================================
        // ABAS
        // ==========================================================
        document.querySelectorAll('.tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('ativo'));
                btn.classList.add('ativo');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('ativo'));
                document.getElementById('tab-' + tab).classList.add('ativo');
                if (tab === 'estatisticas') carregarEstatisticas();
            });
        });

        // ==========================================================
        // FUNÇÕES CRUD - ATALHOS
        // ==========================================================
        function carregarAtalhos() {
            loadingAtalhos.style.display = 'block';
            listaAtalhos.innerHTML = '';
            db.collection('atalhos').orderBy('ordem', 'asc').onSnapshot(snapshot => {
                loadingAtalhos.style.display = 'none';
                listaAtalhos.innerHTML = '';
                if (snapshot.empty) {
                    listaAtalhos.innerHTML = '<li class="sem-reservas">Nenhum atalho cadastrado.</li>';
                    return;
                }
                snapshot.forEach(doc => {
                    const a = doc.data();
                    const li = document.createElement('li');
                    const ativoClass = a.ativo !== false ? 'ativo' : 'inativo';
                    li.innerHTML = `
                        <div class="info">
                            <i class="fas ${a.icone || 'fa-link'}" style="width:24px; text-align:center;"></i>
                            <strong>${a.titulo}</strong>
                            <span class="badge ${ativoClass}">${a.ativo !== false ? 'Ativo' : 'Inativo'}</span>
                            <span style="font-size:0.8rem; color:#718096;">Ordem: ${a.ordem || 0}</span>
                            ${a.link ? `<span style="font-size:0.7rem; background:#e2e8f0; padding:2px 8px; border-radius:12px;">${a.link}</span>` : ''}
                        </div>
                        <div class="acoes">
                            <button class="btn-editar" data-id="${doc.id}"><i class="fas fa-edit"></i></button>
                            <button class="btn-excluir" data-id="${doc.id}"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    listaAtalhos.appendChild(li);

                    // Editar
                    li.querySelector('.btn-editar').addEventListener('click', () => {
                        editarAtalho(doc.id);
                    });
                    // Excluir
                    li.querySelector('.btn-excluir').addEventListener('click', () => {
                        if (confirm('Excluir este atalho?')) {
                            db.collection('atalhos').doc(doc.id).delete()
                                .then(() => showToast('Atalho excluído!'))
                                .catch(err => showToast('Erro: ' + err.message, 'error'));
                        }
                    });
                });
            }, err => {
                loadingAtalhos.style.display = 'none';
                listaAtalhos.innerHTML = '<li style="color:red;">Erro ao carregar atalhos.</li>';
                console.error(err);
            });
        }

        function editarAtalho(id) {
            db.collection('atalhos').doc(id).get().then(doc => {
                if (!doc.exists) return;
                const a = doc.data();
                atalhoId.value = id;
                atalhoTitulo.value = a.titulo || '';
                atalhoIcone.value = a.icone || 'fa-link';
                atalhoLink.value = a.link || '';
                atalhoOrdem.value = a.ordem || 1;
                atalhoAlerta.value = a.alerta || '';
                atalhoAtivo.checked = a.ativo !== false;
                btnCancelarEdicao.style.display = 'inline-block';
                document.querySelector('#formAtalho .btn-salvar').textContent = 'Atualizar';
            });
        }

        formAtalho.addEventListener('submit', e => {
            e.preventDefault();
            const id = atalhoId.value;
            const dados = {
                titulo: atalhoTitulo.value.trim(),
                icone: atalhoIcone.value.trim() || 'fa-link',
                link: atalhoLink.value.trim(),
                ordem: parseInt(atalhoOrdem.value) || 1,
                alerta: atalhoAlerta.value.trim(),
                ativo: atalhoAtivo.checked
            };
            if (!dados.titulo) { showToast('Título é obrigatório.', 'error'); return; }

            const btn = document.querySelector('#formAtalho .btn-salvar');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Salvando...';

            const promise = id ? db.collection('atalhos').doc(id).set(dados, { merge: true }) : db.collection('atalhos').add(dados);
            promise.then(() => {
                showToast('Atalho salvo!');
                resetFormAtalho();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar';
            }).catch(err => {
                showToast('Erro: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar';
            });
        });

        btnCancelarEdicao.addEventListener('click', resetFormAtalho);
        function resetFormAtalho() {
            atalhoId.value = '';
            atalhoTitulo.value = '';
            atalhoIcone.value = 'fa-link';
            atalhoLink.value = '';
            atalhoOrdem.value = '1';
            atalhoAlerta.value = '';
            atalhoAtivo.checked = true;
            btnCancelarEdicao.style.display = 'none';
            document.querySelector('#formAtalho .btn-salvar').innerHTML = '<i class="fas fa-save"></i> Salvar';
        }

        // ==========================================================
        // FUNÇÕES CRUD - NOTÍCIAS
        // ==========================================================
        function carregarNoticias() {
            loadingNoticias.style.display = 'block';
            listaNoticias.innerHTML = '';
            db.collection('noticias').orderBy('data', 'desc').onSnapshot(snapshot => {
                loadingNoticias.style.display = 'none';
                listaNoticias.innerHTML = '';
                if (snapshot.empty) {
                    listaNoticias.innerHTML = '<li class="sem-reservas">Nenhuma notícia publicada.</li>';
                    return;
                }
                snapshot.forEach(doc => {
                    const n = doc.data();
                    const li = document.createElement('li');
                    const ativoClass = n.ativo !== false ? 'ativo' : 'inativo';
                    li.innerHTML = `
                        <div class="info">
                            <strong>${n.titulo}</strong>
                            <span class="badge ${ativoClass}">${n.ativo !== false ? 'Ativo' : 'Inativo'}</span>
                            <span style="font-size:0.8rem; color:#718096;">${n.data || 'Sem data'}</span>
                        </div>
                        <div class="acoes">
                            <button class="btn-editar" data-id="${doc.id}"><i class="fas fa-edit"></i></button>
                            <button class="btn-excluir" data-id="${doc.id}"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    listaNoticias.appendChild(li);

                    li.querySelector('.btn-editar').addEventListener('click', () => {
                        editarNoticia(doc.id);
                    });
                    li.querySelector('.btn-excluir').addEventListener('click', () => {
                        if (confirm('Excluir esta notícia?')) {
                            db.collection('noticias').doc(doc.id).delete()
                                .then(() => showToast('Notícia excluída!'))
                                .catch(err => showToast('Erro: ' + err.message, 'error'));
                        }
                    });
                });
            }, err => {
                loadingNoticias.style.display = 'none';
                listaNoticias.innerHTML = '<li style="color:red;">Erro ao carregar notícias.</li>';
                console.error(err);
            });
        }

        function editarNoticia(id) {
            db.collection('noticias').doc(id).get().then(doc => {
                if (!doc.exists) return;
                const n = doc.data();
                noticiaId.value = id;
                noticiaTitulo.value = n.titulo || '';
                noticiaData.value = n.data || '';
                noticiaConteudo.value = n.conteudo || '';
                noticiaAtivo.checked = n.ativo !== false;
                btnCancelarEdicaoNoticia.style.display = 'inline-block';
                document.querySelector('#formNoticia .btn-salvar').textContent = 'Atualizar';
            });
        }

        formNoticia.addEventListener('submit', e => {
            e.preventDefault();
            const id = noticiaId.value;
            const dados = {
                titulo: noticiaTitulo.value.trim(),
                data: noticiaData.value,
                conteudo: noticiaConteudo.value.trim(),
                ativo: noticiaAtivo.checked
            };
            if (!dados.titulo || !dados.conteudo) {
                showToast('Título e conteúdo são obrigatórios.', 'error');
                return;
            }
            const btn = document.querySelector('#formNoticia .btn-salvar');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Salvando...';

            const promise = id ? db.collection('noticias').doc(id).set(dados, { merge: true }) : db.collection('noticias').add(dados);
            promise.then(() => {
                showToast('Notícia salva!');
                resetFormNoticia();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar';
            }).catch(err => {
                showToast('Erro: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar';
            });
        });

        btnCancelarEdicaoNoticia.addEventListener('click', resetFormNoticia);
        function resetFormNoticia() {
            noticiaId.value = '';
            noticiaTitulo.value = '';
            noticiaData.value = '';
            noticiaConteudo.value = '';
            noticiaAtivo.checked = true;
            btnCancelarEdicaoNoticia.style.display = 'none';
            document.querySelector('#formNoticia .btn-salvar').innerHTML = '<i class="fas fa-save"></i> Salvar';
        }

        // ==========================================================
        // ESTATÍSTICAS
        // ==========================================================
        function carregarEstatisticas() {
            estatisticasContainer.innerHTML = '<div class="loading-placeholder"><div class="spinner"></div> Carregando...</div>';
            // Total de reservas
            db.collection('reservas').get().then(snap => {
                const totalReservas = snap.size;
                // Hoje
                const hoje = new Date().toISOString().slice(0,10);
                db.collection('reservas').where('data', '==', hoje).get().then(snapHoje => {
                    const reservasHoje = snapHoje.size;
                    // Semana (últimos 7 dias)
                    const semanaAtras = new Date();
                    semanaAtras.setDate(semanaAtras.getDate() - 7);
                    const semanaStr = semanaAtras.toISOString().slice(0,10);
                    db.collection('reservas').where('data', '>=', semanaStr).get().then(snapSemana => {
                        const reservasSemana = snapSemana.size;
                        // Contar usuários únicos (por email)
                        db.collection('reservas').get().then(snapAll => {
                            const emails = new Set();
                            snapAll.forEach(doc => {
                                const r = doc.data();
                                if (r.email) emails.add(r.email);
                            });
                            const totalUsuarios = emails.size;

                            estatisticasContainer.innerHTML = `
                                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:20px; margin-top:10px;">
                                    <div style="background:#e3f2fd; padding:20px; border-radius:16px; text-align:center;">
                                        <h4>Total Reservas</h4>
                                        <p style="font-size:2rem; font-weight:700;">${totalReservas}</p>
                                    </div>
                                    <div style="background:#e8f5e9; padding:20px; border-radius:16px; text-align:center;">
                                        <h4>Hoje</h4>
                                        <p style="font-size:2rem; font-weight:700;">${reservasHoje}</p>
                                    </div>
                                    <div style="background:#fff3e0; padding:20px; border-radius:16px; text-align:center;">
                                        <h4>Última semana</h4>
                                        <p style="font-size:2rem; font-weight:700;">${reservasSemana}</p>
                                    </div>
                                    <div style="background:#f3e5f5; padding:20px; border-radius:16px; text-align:center;">
                                        <h4>Usuários únicos</h4>
                                        <p style="font-size:2rem; font-weight:700;">${totalUsuarios}</p>
                                    </div>
                                </div>
                                <p style="margin-top:20px; color:#718096; font-size:0.9rem; text-align:center;">
                                    Última atualização: ${new Date().toLocaleString()}
                                </p>
                            `;
                        });
                    });
                });
            }).catch(err => {
                estatisticasContainer.innerHTML = '<p style="color:red;">Erro ao carregar estatísticas.</p>';
                console.error(err);
            });
        }

        // ==========================================================
        // INICIALIZAR
        // ==========================================================
        function carregarDados() {
            carregarAtalhos();
            carregarNoticias();
            carregarEstatisticas();
            // Definir data atual no campo data da notícia
            const hoje = new Date().toISOString().slice(0,10);
            if (!noticiaData.value) noticiaData.value = hoje;
        }

        // Se já estiver logado, carrega; senão, aguarda.
        if (auth.currentUser) {
            loginScreen.style.display = 'none';
            adminPanel.style.display = 'block';
            carregarDados();
        }

        console.log('✅ Admin DPIPS carregado!');
    </script>
</body>
</html>
