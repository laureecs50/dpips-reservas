<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DPIPS</title>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firebase.googleapis.com">
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #7BA9C9;
            --primary-dark: #5A8DB5;
            --bg-body: #F5F9FF;
            --text-dark: #2C3E50;
        }
        .btn-loading { opacity:0.7; pointer-events:none; }
        .spinner-login {
            display:inline-block; width:20px; height:20px;
            border:3px solid rgba(255,255,255,0.3); border-radius:50%;
            border-top-color:#fff;
            animation:spin 0.8s ease-in-out infinite;
            vertical-align:middle;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .login-box .btn-primary:disabled { opacity:0.7; cursor:not-allowed; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 DPIPS</h1>
            <p>Painel Administrativo</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" value="dpips.dpips@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" value="dpips2024" required>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Entrar</button>
            </form>
            <p class="error-msg" id="errorMsg"></p>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            btn.innerHTML = '<span class="spinner-login"></span> Entrando...';
            btn.disabled = true;
            errorMsg.textContent = '';

            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithEmailAndPassword(auth, email, senha);
                window.location.href = 'admin.html';
            } catch (error) {
                errorMsg.textContent = '❌ ' + error.message;
                btn.innerHTML = 'Entrar';
                btn.disabled = false;
            }
        });
        document.getElementById('loginEmail').focus();
    </script>
</body>
</html>
