<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DPIPS</title>
    <!-- PRECONNECT para carregar mais rápido -->
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firebase.googleapis.com">
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ANIMAÇÃO DE CARREGAMENTO */
        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
        }
        .spinner-login {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* PEQUENO AJUSTE NO FORM */
        .login-box .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 DPIPS</h1>
            <p>Painel Administrativo</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" value="dpips.dpips@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" value="dpips2024" required>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Entrar</button>
            </form>
            
            <p class="error-msg" id="errorMsg"></p>
        </div>
    </div>

    <script type="module">
        // ==========================================================
        // LOGIN OTIMIZADO - Firebase carrega só quando necessário
        // ==========================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            // Feedback visual imediato
            btn.innerHTML = '<span class="spinner-login"></span> Entrando...';
            btn.disabled = true;
            errorMsg.textContent = '';

            try {
                // CARREGA O FIREBASE SOB DEMANDA (mais rápido!)
                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
                const { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } = 
                    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");

                // Configuração do Firebase
                const firebaseConfig = {
                    apiKey: "AIzaSyBmn0YA71iVXgyvb8627D-rv1ZVtkCHLF4",
                    authDomain: "agenda-dpips.firebaseapp.com",
                    projectId: "agenda-dpips",
                    storageBucket: "agenda-dpips.firebasestorage.app",
                    messagingSenderId: "10526411332",
                    appId: "1:10526411332:web:77ef3682a408448bf18a11"
                };

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);

                // Mantém usuário logado mesmo fechando o navegador
                await setPersistence(auth, browserLocalPersistence);
                
                // Faz o login
                await signInWithEmailAndPassword(auth, email, senha);
                
                // Redireciona
                window.location.href = 'admin.html';

            } catch (error) {
                console.error('Erro no login:', error);
                errorMsg.textContent = '❌ ' + error.message;
                btn.innerHTML = 'Entrar';
                btn.disabled = false;
            }
        });

        // Auto-focus no campo de email para agilizar
        document.getElementById('loginEmail').focus();
    </script>
</body>
</html>
